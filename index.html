<!DOCTYPE html>
<html lang="id">

    <!-- Tailwind CSS untuk Desain -->

    <!-- Chart.js untuk Grafik -->

    <!-- Font Awesome untuk Ikon (karena aplikasi ini butuh banyak ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS Khusus agar terasa seperti aplikasi Native (Asli) */
        body {
            -webkit-touch-callout: none; /* Cegah pop-up saat tahan lama */
            -webkit-user-select: none; /* Cegah blok teks */
            user-select: none;
            overflow-y: hidden; /* Mencegah scroll pada body utama, kita atur per halaman */
            background-color: #f8fafc;
        }

        /* Menyembunyikan panah input angka */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Mencegah highlight biru saat elemen disentuh (tap) di HP */
        * { -webkit-tap-highlight-color: transparent; }

        /* Mengatur agar halaman bisa di-scroll tapi navigasi bawah tetap */
        .page-content {

        @keyframes fadeIn {

        /* Tab Bar Aktif */

    </style>
</head>
<body class="text-slate-800 font-sans h-screen w-screen flex flex-col relative">

    <!-- ==============================================
         HALAMAN 1: BERANDA (DASHBOARD)

    <div id="page-home" class="page active page-content p-4">

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-6">

        <div>

    <!-- ==============================================

    <div id="page-history" class="page page-content p-4">
        <header class="mb-6 pt-2 sticky top-0 bg-[#f8fafc] z-10 pb-2">
            <h1 class="text-2xl font-bold text-slate-900">Riwayat Transaksi</h1>
            
            <!-- Filter Tipe (All, Income, Expense) -->
            <div class="flex gap-2 mt-4 overflow-x-auto pb-1">
                <button onclick="filterHistory('all')" id="filter-all" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-white whitespace-nowrap">Semua</button>
                <button onclick="filterHistory('income')" id="filter-income" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-200 text-slate-600 whitespace-nowrap">Pemasukan</button>
                <button onclick="filterHistory('expense')" id="filter-expense" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-200 text-slate-600 whitespace-nowrap">Pengeluaran</button>
            </div>
        </header>

        <div id="full-history-list" class="space-y-3">
            <!-- Data diisi JS -->
        </div>

    <!-- ==============================================
         MODAL (POPUP) TAMBAH TRANSAKSI
         ============================================== -->
    <div id="transaction-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex-col justify-end backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full rounded-t-3xl p-6 pb-8 transform transition-transform translate-y-full" id="modal-content">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-900">Catat Transaksi</h2>
                <button onclick="closeModal()" class="w-8 h-8 bg-slate-100 rounded-full flex justify-center items-center text-slate-500">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="form-add" class="space-y-4">
                <!-- Tipe -->
                <div class="flex p-1 bg-slate-100 rounded-xl">
                    <button type="button" id="modal-btn-expense" onclick="setModalType('expense')" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white text-red-500 shadow-sm transition-all">Pengeluaran</button>
                    <button type="button" id="modal-btn-income" onclick="setModalType('income')" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 transition-all">Pemasukan</button>
                </div>

                <!-- Input Nominal (Besar) -->
                <div class="relative">

                </div>

                <div class="grid grid-cols-2 gap-3">

                    <div>

                    <div>

                        <input type="date" id="input-date" required class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- Keterangan -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">Catatan Singkat</label>
                    <input type="text" id="input-desc" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500" placeholder="Makan siang, Bensin, dll">
                </div>

                <!-- Submit -->
                <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white rounded-xl py-4 font-bold mt-4">
                    Simpan Data
                </button>
            </form>
        </div>
    </div>


    <!-- ==============================================
         NAVIGASI BAWAH (BOTTOM TAB BAR)
         ============================================== -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around items-center h-[65px] px-2 pb-safe z-40">
        <button onclick="switchTab('page-home', 'tab-home')" id="tab-home" class="tab-btn active flex flex-col items-center justify-center w-16 text-slate-400 transition-colors">
            <i class="fa-solid fa-house text-xl mb-1"></i>
            <span class="text-[10px] font-medium">Beranda</span>
        </button>
        
        <!-- Tombol Tengah Mengambang (Floating Action Button style) -->
        <button onclick="openModal()" class="w-14 h-14 bg-blue-600 rounded-full flex justify-center items-center text-white shadow-lg shadow-blue-500/40 -translate-y-4 border-4 border-white">
            <i class="fa-solid fa-plus text-2xl"></i>
        </button>

        <button onclick="switchTab('page-history', 'tab-history')" id="tab-history" class="tab-btn flex flex-col items-center justify-center w-16 text-slate-400 transition-colors">
            <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
            <span class="text-[10px] font-medium">Riwayat</span>
        </button>
    </nav>


    <!-- ==============================================
         LOGIKA APLIKASI (JAVASCRIPT)
         ============================================== -->
    <script>
        // --- 1. STATE & DATA ---
        let transactions = [];
        let modalType = 'expense';
        let currentFilter = 'all'; // Untuk halaman riwayat
        let chartInstance = null;

        // Kategori Statis dengan Ikon dan Warna
        const categories = {
            income: [
                { id: 'Gaji', icon: 'fa-money-bill-wave', color: 'text-emerald-500', bg: 'bg-emerald-100' },
                { id: 'Bonus', icon: 'fa-gift', color: 'text-teal-500', bg: 'bg-teal-100' },
                { id: 'Investasi', icon: 'fa-arrow-trend-up', color: 'text-blue-500', bg: 'bg-blue-100' },
                { id: 'Lainnya', icon: 'fa-box-open', color: 'text-slate-500', bg: 'bg-slate-100' }
            ],
            expense: [
                { id: 'Makanan', icon: 'fa-utensils', color: 'text-orange-500', bg: 'bg-orange-100' },
                { id: 'Transport', icon: 'fa-car', color: 'text-blue-500', bg: 'bg-blue-100' },
                { id: 'Tagihan', icon: 'fa-file-invoice-dollar', color: 'text-red-500', bg: 'bg-red-100' },
                { id: 'Belanja', icon: 'fa-bag-shopping', color: 'text-pink-500', bg: 'bg-pink-100' },
                { id: 'Kesehatan', icon: 'fa-notes-medical', color: 'text-rose-500', bg: 'bg-rose-100' },
                { id: 'Hiburan', icon: 'fa-gamepad', color: 'text-purple-500', bg: 'bg-purple-100' },
                { id: 'Lainnya', icon: 'fa-box-open', color: 'text-slate-500', bg: 'bg-slate-100' }
            ]
        };

        // --- 2. PENYIMPANAN LOKAL (LOCALSTORAGE) ---
        // Karena aplikasi ini belum disambungkan Firebase oleh user, kita gunakan LocalStorage HP
        // agar data tersimpan meski aplikasi ditutup. Ini sangat cocok untuk PWA.
        function loadLocalData() {
            const savedData = localStorage.getItem('uangku_data');
            if (savedData) {
                transactions = JSON.parse(savedData);
                updateSemuaUI();
            } else {
                updateSemuaUI(); // Render state kosong
            }
        }

        function saveLocalData() {
            localStorage.setItem('uangku_data', JSON.stringify(transactions));
            updateSemuaUI();
        }

        // --- 3. FORMATTER ---
        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        function getCategoryData(type, id) {
            const catList = categories[type];
            return catList.find(c => c.id === id) || { icon: 'fa-circle-question', color: 'text-slate-500', bg: 'bg-slate-100' };
        }

        // --- 4. NAVIGASI BAWAH & MODAL ---
        function switchTab(pageId, tabId) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function openModal() {
            const modal = document.getElementById('transaction-modal');
            const content = document.getElementById('modal-content');
            
            document.getElementById('input-date').valueAsDate = new Date();
            setModalType('expense'); // Default
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // Trigger reflow untuk animasi
            void modal.offsetWidth; 
            content.classList.remove('translate-y-full');
        }

        function closeModal() {
            const modal = document.getElementById('transaction-modal');
            const content = document.getElementById('modal-content');
            
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.getElementById('form-add').reset();
            }, 300); // Tunggu animasi CSS selesai
        }

        function setModalType(type) {
            modalType = type;
            const btnExp = document.getElementById('modal-btn-expense');
            const btnInc = document.getElementById('modal-btn-income');
            const selCat = document.getElementById('input-category');

            if (type === 'expense') {
                btnExp.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white text-red-500 shadow-sm transition-all";
                btnInc.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 transition-all";
            } else {
                btnInc.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white text-emerald-500 shadow-sm transition-all";
                btnExp.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 transition-all";
            }

            // Update Options
            selCat.innerHTML = '<option value="" disabled selected>Pilih...</option>';
            categories[type].forEach(cat => {
                selCat.innerHTML += `<option value="${cat.id}">${cat.id}</option>`;
            });
        }

        // --- 5. RENDER UI ---
        function updateSemuaUI() {
            // Urutkan transaksi: terbaru di atas
            transactions.sort((a, b) => new Date(b.date) - new Date(a.date) || b.id - a.id);

            // Hitung Saldo
            let tInc = 0, tExp = 0;
            transactions.forEach(t => {
                if (t.type === 'income') tInc += t.amount;
                if (t.type === 'expense') tExp += t.amount;
            });
            
            document.getElementById('home-total-balance').innerText = formatIDR(tInc - tExp);
            document.getElementById('home-total-income').innerText = formatIDR(tInc);
            document.getElementById('home-total-expense').innerText = formatIDR(tExp);

            // Render List Beranda (Maksimal 5)
            renderList(transactions.slice(0, 5), 'home-recent-list');
            
            // Render List Riwayat (Semua, berdasarkan filter)
            let filteredTrans = transactions;
            if (currentFilter !== 'all') {
                filteredTrans = transactions.filter(t => t.type === currentFilter);
            }
            renderList(filteredTrans, 'full-history-list', true);

            // Render Chart
            renderChart();
        }

        function renderList(dataArray, containerId, allowDelete = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (dataArray.length === 0) {
                container.innerHTML = `<div class="text-center py-8 bg-white rounded-2xl border border-slate-100 text-slate-400 text-sm">
                    <i class="fa-solid fa-receipt text-3xl mb-2 opacity-50 block"></i>
                    Belum ada catatan
                </div>`;
                return;
            }

            dataArray.forEach(t => {
                const isInc = t.type === 'income';
                const catInfo = getCategoryData(t.type, t.category);
                const dateStr = new Date(t.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
                
                // Jika di halaman riwayat, tambahkan tombol hapus
                let deleteBtn = '';
                if (allowDelete) {
                    deleteBtn = `<button onclick="hapusTransaksi(${t.id})" class="ml-3 text-slate-300 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can"></i></button>`;
                }

                container.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center ${catInfo.bg} ${catInfo.color}">
                                <i class="fa-solid ${catInfo.icon}"></i>
                            </div>
                            <div>
                                <p class="font-bold text-slate-800 text-sm leading-tight">${t.description}</p>
                                <p class="text-[11px] text-slate-400 mt-0.5">${t.category} • ${dateStr}</p>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <p class="font-bold text-sm ${isInc ? 'text-emerald-500' : 'text-slate-800'}">
                                ${isInc ? '+' : '-'}${formatIDR(t.amount)}
                            </p>
                            ${deleteBtn}
                        </div>
                    </div>
                `;
            });
        }

        function renderChart() {
            const ctx = document.getElementById('expenseChart');
            const emptyMsg = document.getElementById('empty-chart-msg');
            
            // Ambil pengeluaran saja bulan ini (Asumsi sederhana: abaikan bulan, kumpulkan kategori saja)
            const expenses = transactions.filter(t => t.type === 'expense');
            
            if (expenses.length === 0) {
                if (chartInstance) chartInstance.destroy();
                emptyMsg.classList.remove('hidden');
                return;
            }
            emptyMsg.classList.add('hidden');

            // Hitung total per kategori pengeluaran
            const catTotals = {};
            expenses.forEach(t => {
                catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
            });

            const labels = Object.keys(catTotals);
            const dataValues = Object.values(catTotals);
            
            // Generate warna berdasarkan kategori
            const bgColors = labels.map(label => {
                const info = getCategoryData('expense', label);
                // Ubah kelas tailwind text-red-500 menjadi warna hex untuk chart (Pendekatan sederhana)
                if(info.color.includes('red')) return '#ef4444';
                if(info.color.includes('orange')) return '#f97316';
                if(info.color.includes('blue')) return '#3b82f6';
                if(info.color.includes('pink')) return '#ec4899';
                if(info.color.includes('rose')) return '#f43f5e';
                if(info.color.includes('purple')) return '#a855f7';
                return '#94a3b8'; // default
            });

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: bgColors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { position: 'right', labels: { boxWidth: 10, font: {size: 10} } }
                    }
                }
            });
        }

        // --- 6. INTERAKSI USER (SUBMIT & HAPUS) ---
        document.getElementById('form-add').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newT = {
                id: Date.now(), // Unique ID
                type: modalType,
                amount: parseFloat(document.getElementById('input-amount').value),
                category: document.getElementById('input-category').value,
                date: document.getElementById('input-date').value,
                description: document.getElementById('input-desc').value
            };

            transactions.push(newT);
            saveLocalData(); // Simpan & Render UI
            closeModal();
        });

        window.hapusTransaksi = function(id) {
            if(confirm("Hapus transaksi ini?")) {
                transactions = transactions.filter(t => t.id !== id);
                saveLocalData();
            }
        };

        window.filterHistory = function(type) {
            currentFilter = type;
            
            // Atur gaya tombol filter
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-slate-800', 'text-white');
                btn.classList.add('bg-slate-200', 'text-slate-600');
            });
            
            const activeBtn = document.getElementById(`filter-${type}`);
            activeBtn.classList.remove('bg-slate-200', 'text-slate-600');
            activeBtn.classList.add('bg-slate-800', 'text-white');

            updateSemuaUI();
        };

        // --- INISIALISASI ---
        document.addEventListener('DOMContentLoaded', () => {
            // Tutup modal jika klik area luar modal
            document.getElementById('transaction-modal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
            
            loadLocalData();
        });
    </script>
</body>
</html>
