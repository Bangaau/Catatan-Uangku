<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UangKu - Pemantau Keuangan Pribadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sembunyikan panah pada input number di berbagai browser */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        
        <!-- Header -->
        <header class="flex items-center gap-3 mb-8">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
                    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" />
                    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5" />
                    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-slate-900">UangKu</h1>
                <p class="text-sm text-slate-500">Pantau Pemasukan & Pengeluaran Anda</p>
            </div>
        </header>

        <!-- Kartu Ringkasan (Summary Cards) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <!-- Total Saldo -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <div class="flex items-center gap-2 text-slate-500 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" /><path d="M3 5v14a2 2 0 0 0 2 2h16v-5" /><path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />
                    </svg>
                    <h2 class="font-medium">Total Saldo</h2>
                </div>
                <p id="total-balance" class="text-3xl font-bold text-slate-900">Rp 0</p>
            </div>

            <!-- Total Pemasukan -->
            <div class="bg-green-50 p-6 rounded-2xl border border-green-100 flex flex-col justify-between">
                <div class="flex items-center gap-2 text-green-700 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" />
                    </svg>
                    <h2 class="font-medium">Pemasukan</h2>
                </div>
                <p id="total-income" class="text-3xl font-bold text-green-800">Rp 0</p>
            </div>

            <!-- Total Pengeluaran -->
            <div class="bg-red-50 p-6 rounded-2xl border border-red-100 flex flex-col justify-between">
                <div class="flex items-center gap-2 text-red-700 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <polyline points="22 17 13.5 8.5 8.5 13.5 2 7" /><polyline points="16 17 22 17 22 11" />
                    </svg>
                    <h2 class="font-medium">Pengeluaran</h2>
                </div>
                <p id="total-expense" class="text-3xl font-bold text-red-800">Rp 0</p>
            </div>
        </div>

        <!-- Konten Utama: Form & Riwayat -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Bagian Kiri: Form Tambah Transaksi -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 sticky top-8">
                    <h3 class="text-lg font-bold text-slate-900 mb-4">Tambah Transaksi</h3>
                    
                    <form id="transaction-form" class="space-y-4">
                        <!-- Tipe Toggle -->
                        <div class="flex p-1 bg-slate-100 rounded-lg">
                            <button type="button" id="btn-expense" onclick="setType('expense')" class="flex-1 py-2 text-sm font-medium rounded-md transition-colors bg-white text-red-600 shadow-sm">
                                Pengeluaran
                            </button>
                            <button type="button" id="btn-income" onclick="setType('income')" class="flex-1 py-2 text-sm font-medium rounded-md transition-colors text-slate-500 hover:text-slate-700">
                                Pemasukan
                            </button>
                        </div>

                        <!-- Input Jumlah -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Jumlah (Rp)</label>
                            <input type="number" id="input-amount" min="0" step="1" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors" placeholder="Contoh: 50000">
                        </div>

                        <!-- Input Deskripsi -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Keterangan</label>
                            <input type="text" id="input-desc" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors" placeholder="Contoh: Makan siang">
                        </div>

                        <!-- Dropdown Kategori -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
                            <select id="input-category" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                                <option value="" disabled selected>Pilih Kategori</option>
                                <!-- Opsi diisi via JS -->
                            </select>
                        </div>

                        <!-- Input Tanggal -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal</label>
                            <input type="date" id="input-date" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                        </div>

                        <!-- Tombol Simpan -->
                        <button type="submit" class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                                <path d="M5 12h14" /><path d="M12 5v14" />
                            </svg>
                            Simpan Transaksi
                        </button>
                    </form>
                </div>
            </div>

            <!-- Bagian Kanan: Riwayat Transaksi -->
            <div class="lg:col-span-2">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 min-h-full">
                    <h3 class="text-lg font-bold text-slate-900 mb-4">Riwayat Transaksi</h3>
                    <div id="transaction-list" class="space-y-4">
                        <!-- Daftar transaksi dirender via JS -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Murni (Vanilla JS) -->
    <script>
        // Data transaksi (kosong di awal)
        let transactions = [];
        let currentType = 'expense';

        const categories = {
            income: ['Gaji', 'Bonus', 'Hadiah', 'Investasi', 'Lainnya'],
            expense: ['Makanan', 'Transportasi', 'Tagihan', 'Hiburan', 'Belanja', 'Kesehatan', 'Pendidikan', 'Lainnya']
        };

        // Set tanggal hari ini sebagai default di form
        document.getElementById('input-date').valueAsDate = new Date();

        // Format Uang
        function formatIDR(number) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0,
            }).format(number);
        }

        // Update Opsi Kategori berdasarkan tipe
        function updateCategoryOptions() {
            const catSelect = document.getElementById('input-category');
            catSelect.innerHTML = '<option value="" disabled selected>Pilih Kategori</option>';
            categories[currentType].forEach(cat => {
                catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        // Fungsi saat tombol tipe diklik
        function setType(type) {
            currentType = type;
            const btnExp = document.getElementById('btn-expense');
            const btnInc = document.getElementById('btn-income');

            if (type === 'expense') {
                btnExp.className = "flex-1 py-2 text-sm font-medium rounded-md transition-colors bg-white text-red-600 shadow-sm";
                btnInc.className = "flex-1 py-2 text-sm font-medium rounded-md transition-colors text-slate-500 hover:text-slate-700";
            } else {
                btnInc.className = "flex-1 py-2 text-sm font-medium rounded-md transition-colors bg-white text-green-600 shadow-sm";
                btnExp.className = "flex-1 py-2 text-sm font-medium rounded-md transition-colors text-slate-500 hover:text-slate-700";
            }
            updateCategoryOptions();
        }

        // Menghitung & Update Tampilan Kartu Ringkasan
        function updateSummary() {
            let totalIncome = 0;
            let totalExpense = 0;

            transactions.forEach(t => {
                if (t.type === 'income') totalIncome += t.amount;
                if (t.type === 'expense') totalExpense += t.amount;
            });

            const balance = totalIncome - totalExpense;

            const balanceEl = document.getElementById('total-balance');
            balanceEl.innerText = formatIDR(balance);
            balanceEl.className = `text-3xl font-bold ${balance >= 0 ? 'text-slate-900' : 'text-red-600'}`;
            
            document.getElementById('total-income').innerText = formatIDR(totalIncome);
            document.getElementById('total-expense').innerText = formatIDR(totalExpense);
        }

        // Render List Transaksi
        function renderTransactions() {
            const listEl = document.getElementById('transaction-list');
            listEl.innerHTML = '';

            if (transactions.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <p>Belum ada transaksi yang dicatat.</p>
                        <p class="text-sm mt-1">Mulai tambahkan transaksi pertama Anda!</p>
                    </div>
                `;
                return;
            }

            transactions.forEach(t => {
                const isIncome = t.type === 'income';
                const dateObj = new Date(t.date);
                const dateStr = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

                const iconSvg = isIncome 
                    ? `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7" /><polyline points="16 17 22 17 22 11" /></svg>`;

                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100 hover:shadow-md transition-shadow group";
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="p-3 rounded-full ${isIncome ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                            ${iconSvg}
                        </div>
                        <div>
                            <p class="font-semibold text-slate-900">${t.description}</p>
                            <div class="flex items-center gap-2 text-sm text-slate-500 mt-1">
                                <span class="bg-slate-200 px-2 py-0.5 rounded-md text-xs">${t.category}</span>
                                <span>•</span>
                                <span>${dateStr}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <p class="font-bold ${isIncome ? 'text-green-600' : 'text-slate-900'}">
                            ${isIncome ? '+' : '-'}${formatIDR(t.amount)}
                        </p>
                        <button onclick="deleteTransaction(${t.id})" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100" title="Hapus transaksi">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></svg>
                        </button>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        // Hapus Transaksi
        window.deleteTransaction = function(id) {
            transactions = transactions.filter(t => t.id !== id);
            updateSummary();
            renderTransactions();
        };

        // Submit Form
        document.getElementById('transaction-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const amount = document.getElementById('input-amount').value;
            const desc = document.getElementById('input-desc').value;
            const category = document.getElementById('input-category').value;
            const date = document.getElementById('input-date').value;

            if (!amount || !desc || !category || !date) return;

            const newTransaction = {
                id: Date.now(),
                type: currentType,
                amount: parseFloat(amount),
                description: desc,
                category: category,
                date: date
            };

            // Tambahkan ke paling atas
            transactions.unshift(newTransaction);

            // Reset form (kecuali tanggal untuk kemudahan input)
            document.getElementById('input-amount').value = '';
            document.getElementById('input-desc').value = '';
            document.getElementById('input-category').value = '';

            // Update UI
            updateSummary();
            renderTransactions();
        });

        // Inisialisasi awal
        updateCategoryOptions();
        updateSummary();
        renderTransactions();
    </script>
</body>
</html>
